name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        run: |
          F=$(find . -name build.gradle -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then
            echo "build.gradle не найден. Структура репозитория:"
            find . -not -path './.git/*' | head -n 60
            exit 1
          fi
          cd "$(dirname "$F")"
          gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rmenu
          path: '**/build/libs/*.jar'
