name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          F=$(find . -name build.gradle -not -path ‘./.git/*’ | awk ‘{print length, $0}’ | sort -n | head -1 | cut -d’ ‘ -f2-)
          if [ -z «$F» ]; then
            echo «NO build.gradle IN REPO»
            find . -path ./.git -prune -o -type f -print | head -50
            exit 1
          fi
          echo «PROJ=$(dirname «$F»)» >> «$GITHUB_ENV»
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.2.1 }
      - run: gradle build
        working-directory: ${{ env.PROJ }}
      - uses: actions/upload-artifact@v4
        with:
          name: pulsemod-jar
          path: ${{ env.PROJ }}/build/libs/pulsemod-1.0.0.jar
